<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAZ 单词图片预览 - AA 等级</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .stats {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }
    
    .stat-label {
      color: #666;
      margin-top: 5px;
    }
    
    .controls {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .controls input {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    
    .controls input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.15);
    }
    
    .card-img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #f8f9fa;
      padding: 10px;
    }
    
    .card-info {
      padding: 15px;
    }
    
    .card-word {
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    
    .card-trans {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 5px;
    }
    
    .card-scope {
      font-size: 0.8em;
      color: #999;
    }
    
    .loading {
      text-align: center;
      color: white;
      font-size: 1.5em;
      padding: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 RAZ 单词图片预览 - AA 等级</h1>
    
    <div class="stats" id="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalWords">0</div>
        <div class="stat-label">总单词数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="withImages">0</div>
        <div class="stat-label">有图片</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="displayed">0</div>
        <div class="stat-label">当前显示</div>
      </div>
    </div>
    
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 搜索单词...">
      <select id="scopeFilter" style="padding: 10px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px;">
        <option value="">所有范围</option>
        <option value="小学词汇">小学词汇</option>
        <option value="初中词汇">初中词汇</option>
        <option value="高中词汇">高中词汇</option>
      </select>
    </div>
    
    <div class="grid" id="wordGrid">
      <div class="loading">加载中...</div>
    </div>
  </div>
  
  <script>
    let allWords = [];
    let filteredWords = [];
    
    async function loadData() {
      try {
        const response = await fetch('./data/school/raz.json');
        const data = await response.json();
        allWords = data.AA || [];
        filteredWords = allWords;
        
        updateStats();
        renderWords();
      } catch (error) {
        console.error('加载数据失败:', error);
        document.getElementById('wordGrid').innerHTML = '<div class="loading">❌ 加载失败，请检查文件路径</div>';
      }
    }
    
    function updateStats() {
      const withImages = allWords.filter(w => w.img).length;
      document.getElementById('totalWords').textContent = allWords.length;
      document.getElementById('withImages').textContent = withImages;
      document.getElementById('displayed').textContent = filteredWords.length;
    }
    
    function renderWords() {
      const grid = document.getElementById('wordGrid');
      if (filteredWords.length === 0) {
        grid.innerHTML = '<div class="loading">没有找到匹配的单词</div>';
        return;
      }
      
      grid.innerHTML = filteredWords.map(word => {
        const trans = word.trans && word.trans[0] ? word.trans[0].split(/[；;\n]/)[0].replace(/^[a-z]+\.\s*/, '') : '';
        const scope = word.scope && word.scope.length > 0 ? word.scope.join('、') : '';
        const imgSrc = word.img || './img/raz-aa/' + word.name.toLowerCase() + '.svg';
        
        return `
          <div class="card">
            <img src="${imgSrc}" alt="${word.name}" class="card-img" 
                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjJmM2Y1Ii8+PHRleHQgeD0iMjU2IiB5PSIyNTYiIGZvbnQtc2l6ZT0iNDgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMzNDQ5NWUiPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='">
            <div class="card-info">
              <div class="card-word">${word.name.toLowerCase()}</div>
              <div class="card-trans">${trans}</div>
              <div class="card-scope">${scope}</div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    function filterWords() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const scopeFilter = document.getElementById('scopeFilter').value;
      
      filteredWords = allWords.filter(word => {
        const matchSearch = !searchTerm || 
          word.name.toLowerCase().includes(searchTerm) ||
          (word.trans && word.trans.some(t => t.toLowerCase().includes(searchTerm)));
        
        const matchScope = !scopeFilter || 
          (word.scope && word.scope.includes(scopeFilter));
        
        return matchSearch && matchScope;
      });
      
      updateStats();
      renderWords();
    }
    
    document.getElementById('searchInput').addEventListener('input', filterWords);
    document.getElementById('scopeFilter').addEventListener('change', filterWords);
    
    loadData();
  </script>
</body>
</html>

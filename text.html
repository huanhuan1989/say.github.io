  /**
   * simulationClick  模拟A标签
   * @param {String} url  地址
   */
  const simulationTheATag = (url, isTarget = false) => {
    const aDom = document.createElement('a')
    const fileName = url.substring(url.lastIndexOf('/') + 1).split('?')[0]
    aDom.href = url
    isTarget && (aDom.target = '_blank')
    aDom.download = fileName
    document.body.appendChild(aDom)
    aDom.click()

    setTimeout(() => {
      document.body.removeChild(aDom)
    }, 1000)
  }

  // 优化后的 FormData 构建函数
  const createFormData = (params) => {
    const formData = new FormData();
    Object.keys(params).forEach((el) => {
      const value = params[el];
      // 处理复杂类型（当前示例用不到，仅增强鲁棒性）
      if (Array.isArray(value) || (typeof value === 'object' && value !== null)) {
        formData.append(el, JSON.stringify(value));
      } else {
        formData.append(el, value);
      }
    });
    return formData;
  };

  // 保存 Blob 为本地文件的通用工具函数
  const saveBlobToLocal = (blob, fileName) => {
    // 封装为 MP3 格式的 Blob
    const mp3Blob = new Blob([blob], { type: 'audio/wav' });

    // 兼容 IE 10+
    if (window.navigator.msSaveBlob) {
      window.navigator.msSaveBlob(mp3Blob, fileName);
      return;
    }

    // 现代浏览器（Chrome/Firefox/Edge 等）
    // 1. 创建临时下载链接
    const downloadLink = document.createElement('a');
    // 2. 生成 Blob 临时 URL（浏览器内存中，不会上传服务器）
    const blobUrl = URL.createObjectURL(mp3Blob);

    // 3. 设置下载属性
    downloadLink.href = blobUrl;
    downloadLink.download = fileName; // 自定义下载的文件名
    downloadLink.style.display = 'none'; // 隐藏标签

    // 4. 插入页面并模拟点击
    document.body.appendChild(downloadLink);
    downloadLink.click();

    // 5. 清理资源（避免内存泄漏）
    document.body.removeChild(downloadLink);
    URL.revokeObjectURL(blobUrl); // 释放临时 URL
  };

    return new Promise((resolve, reject) => {

        processData: false,

      })
      .done(function(blobData){
        console.log(`请求 ${index} 成功：${params.name}`);
        resolve({ blob: blobData, target: `${params.name}.mp3` });
      }).fail(function(error){
          console.error(`请求 ${index} 失败：${params.name}，原因：${error}`);
          reject({ err, status, target: `${params.name}.mp3` });

    });
  }

  /**
   * 严格分组并发请求（每组完成再发下一组）
   * @param {Array} requestList - 请求参数数组
   * @param {Function} requestFn - 单个请求函数（返回Promise）
   * @param {Number} concurrency - 每次并发数（默认3）
   * @returns {Promise} 所有请求完成的结果
   */
  function batchRequest(requestList, requestFn, concurrency = 3) {
    // 深拷贝数组，避免修改原数据
    const pendingList = JSON.parse(JSON.stringify(requestList));
    const allResults = []; // 存储所有请求结果

    // 执行单组请求的核心函数
    function executeOneBatch() {
      // 取出当前组的请求（最多3个）
      const currentBatch = pendingList.splice(0, concurrency);
      // 没有待执行请求，返回所有结果
      if (currentBatch.length === 0) {
        return Promise.resolve(allResults);
      }

      console.log(`\n开始执行第 ${Math.ceil(allResults.length/concurrency) + 1} 组请求，共 ${currentBatch.length} 个`);

      // 为当前组的每个请求创建Promise（手动捕获错误，确保Promise.all不中断）
      const batchPromises = currentBatch.map((params, batchIndex) => {
        const globalIndex = allResults.length + batchIndex; // 全局请求索引
        return requestFn(params, globalIndex) // 执行单个请求
          .then((res) => {
            // 成功结果
            return {
              index: globalIndex,
              params,
              status: 'success',
              data: res
            };
          })
          .catch((err) => {
            // 失败结果（手动catch，避免Promise.all失败）
            return {
              index: globalIndex,
              params,
              status: 'fail',
              error: err
            };
          });
      });

      // 等待当前组所有请求完成（成功/失败都等），再执行下一组
      return Promise.all(batchPromises)
        .then((batchResults) => {
          // 将当前组结果存入总结果
          allResults.push(...batchResults);
          console.log(`第 ${Math.ceil(allResults.length/concurrency)} 组请求完成，结果：`, batchResults);
          // 递归执行下一组
          return executeOneBatch();
        });
    }

    // 启动第一组请求
    return executeOneBatch();
  }

  // 4. 执行并发请求（每次3个，完成一组再下一组）
  batchRequest(requestDataList, singleRequest, 3)
    .then((allResults) => {
      console.log('所有请求完成，结果列表：', allResults);
      // 遍历结果，处理成功/失败的请求
      allResults.forEach((result) => {
        if (result.status === 'success') {
          console.log(`请求成功（${result.data.target}）：`, result.data.blob);
          // 可选：下载成功的 MP3
          saveBlobToLocal(result.data.blob, result.data.target);
        } else {
          console.error(`请求失败（${result.data.target}）：`, result.error);
        }
      });
    });

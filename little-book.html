<!DOCTYPE html>
<html lang = "zh">
<head>
  <meta charset = "UTF-8">
  <meta name = "viewport" content = "width = device-width,initial-scale = 1.0" />
  <title>外研社英语课本单词学习及默写</title>
  <style>
    /* 整个滚动条 */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    /* 滚动条轨道 */
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    /* 滚动条滑块 */
    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 10px;
    }

    /* 滑块在鼠标悬停时的样式 */
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
      cursor: pointer;
    }
    body {
      font-family:Arial,sans-serif;
      text-align:center;
      background:#f7f7f7;
      overflow: hidden;
    }
    .head {
      margin-bottom: 12px;
    }
    .appContainer {
      display: flex;
    }
    .tabs {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 84vh;
    }
    .tabs .tabs-main {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-right: 10px;
    }
    .tabs button {
      margin:4px;
      padding:10px 14px;
      border:none;
      background:#eee;
      cursor:pointer;
      border-radius:6px;
      max-width: 200px;
    }
    .tabs button.active {
      background:#007bff;
      color:#fff;
    }
    .mainContainer {
      margin: auto 12px;
      flex: 1;
      font-size: 0;
      overflow-y: auto;           /* 内容多时允许滚动 */
      max-height: 84vh;           /* 与左侧 tabs 高度一致，防止超出视窗 */
    }
    .control-select {
      cursor: pointer;
      border-radius: 8px;
      padding: 9px 14px;
      border: 1px solid #666;
      margin: 0 6px;
      max-width: 200px;
    }
    #levelSelect {
      padding: 6px 10px;
      border-radius: 6px;
    }
    #inputContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    #inputContainer input {
      width: 40px;
      height: 50px;
      font-size: 48px;
      text-align:center;
      margin: 1px;
      padding: 4px;
      text-transform:lowercase;
      border-radius:6px;
      border: none;
      outline: none;
      background-color: transparent;
      border-bottom: 5px solid #333;
      cursor: pointer;
      font-weight: 700;
      caret-color: green;
      animation: blink 1s infinite;
      -webkit-input-placeholder {
        cursor: text;
        font-weight: 700;;
      }
    }
    @keyframes blink {
      0%, 100% { caret-color: #007bff; }
      50% { caret-color: transparent; }
    }
    #inputContainer input::placeholder {
      color: #555;
    }
    #inputContainer input:focus {
      outline: none;
      border-bottom-color: #007bff;
    }
    
    .hidden-placeholder::placeholder {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .hidden-placeholder:hover::placeholder,
    #inputContainer:hover .hidden-placeholder::placeholder {
      opacity: 1;
    }
    #inputContainer .placeholder {
      width: 30px;
      height: 52px;
      display: block;
      color: #333;
    }
    #inputContainer.easy input {
      border: none;
      background-color: transparent;
    }
    #inputContainer.easy input:focus {
      outline: none;
      border: none;
    }
    .correct {
      border-color:green;
      color:green;
    }
    .wrong {
      border-color:red;
      color:red;
    }
    button.control-btn {
      padding:10px 14px;
      background: #eee;
      color: #333;
      border:none;
      cursor:pointer;
      border-radius:8px;
      font-size:12px;
      margin: 12px 4px;
    }
    button.control-btn:hover,
    button.active {
      background: #007bff;
      color: #fff;
    }
    /* 与按钮风格一致的下拉框样式 */
    .select {
      padding:10px 14px;
      background:#eee;
      color:#333;
      border:none;
      cursor:pointer;
      border-radius:8px;
      font-size:12px;
      margin: 12px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      outline: none;
    }
    .select:hover,
    .select:focus {
      background:#007bff;
      color:#fff;
      outline: none;
    }
    .select option {
      color:#333;
    }
    .wordContainer {
      display: flex;
      font-size: 20px;
      color: #333;
      margin: 24px 0;
      justify-content: center;
      flex-direction: column;
    }
    #wordDisplay {
      font-size: 48px;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }
    #meaning {
      font-size: 18px;
      display: flex;
      flex-direction: column;
    }
    #meaning span {
      margin-bottom: 12px;
    }
    .toolContainer {
      display: flex;
      justify-content: center;
    }
    .sound-btn {
      background: transparent;
      border: none;
      outline: none;
      margin-left: 12px;
      cursor: pointer;
    }
    #speakerPath {
      animation: flash 1s infinite; /* 1秒循环，无限播放 */
    }
    @keyframes flash {
      0% { fill: #FF5733; } /* 初始颜色 */
      50% { fill: #FFC300; } /* 中间颜色 */
      100% { fill: #FF5733; } /* 回到初始颜色 */
    }
    
    #soundmark {
      font-size: 14px;
      margin-bottom: 12px;
      color: #777;
    }
    .speaker {
      height: 34px; /* 你可以改为任意尺寸 */
      width: auto;
      cursor: pointer;
      fill: none;
      stroke: #333;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke 0.3s ease;
    }
    .speaker:hover {
      stroke: #222;
    }
    .wave {
      opacity: 0;
    }
    .playing .wave {
      animation: waveFlow 2.8s ease-in-out infinite;
    }
    #example {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes waveFlow {
      0%   { opacity: 0; }
      15%  { opacity: 0.9; }
      60%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @media(max-width: 900px) {
      body {
        padding: 0;
        overflow: auto;
      }

      .appContainer {
        display: block;
      }

      .tabs,
      .tabs .tabs-main {
        display: block;
        height: 40vh;
      }

      .mainContainer {
        margin: 30px 0;
        width: 100%;
      }

      #inputContainer input {
        width: 15%;
      }
    }

    .hide {
      display: none;
    }
    /* 列表版样式（尽量不影响现有样式） */
    #listContainer { 
      display: block;
      padding: 12px;
    }
    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      align-items: stretch;
    }
    .list-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .list-card .title {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin-top: 6px;
    }
    .list-card .sub {
      margin-top: 6px;
      color: #666;
      font-size: 14px;
      text-align: center;
    }
    .list-card img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      display: block;
      margin: 8px auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .play-mini {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    /* 让播放按钮里的喇叭变为白色 */
    .play-mini .speaker { stroke: #fff; }
    /* 卡片可点击播放整体 */
    .list-card { cursor: pointer; }
    .list-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.09); }
  </style>
</head>
<body>
  <div class="head" id="navbar">
    <button class="control-btn changeIt active" data-type="next" id="nextBtn" style="display:none;">下一个单词</button>
  </div>
  
  <div class="appContainer">
    <div class="tabs">
      <div class="tabs-main" id="tabContainer">
        <button class="active" data-type="tabBtn" data-index="2">列表版</button>
        <button class="" data-type="tabBtn" data-index="1">简便版</button>
      </div>
    </div>
    <div class="mainContainer">
      <div class="wordContainer" style="display:none;">
        <div id="wordDisplay" class="hide"></div>
        <div class="toolContainer">
          <div id="inputContainer" class="hard"></div>
          <button class="sound-btn" data-type="sound">
            <svg class="speaker" viewBox="0 0 64 64" id="speaker" data-type="sound">
              <!-- 喇叭主体 -->
              <polygon points="16,24 28,24 40,12 40,52 28,40 16,40" data-type="sound" stroke-linejoin="round"/>
              <!-- 动态波纹 -->
              <g id="waves" data-type="sound" style="transform: translateX(6px);"></g>
            </svg>
          </button>
        </div>
        <div id="soundmark"></div>
        <div id="meaning"></div>
        <div id="example"></div>
      </div>
      <!-- 列表版容器 -->
      <div id="listContainer">
        <div class="list-grid" id="listGrid"></div>
      </div>
      
    </div>
  </div>

  <audio id="soundCorrect" src="./files/correct.wav"></audio>
  <audio id="soundWrong" src="./files/beep.wav"></audio>

  <script src="./js/jQuery.min.js"></script>
  <script src="./js/base.js"></script>

  <script>
    let words = [];
    let currentIndex = 0;
    let dataType = 'easy';  // easy|medium|hard
    let reviewList = [];
    const wrongCountMap = {};
    let timer = null;
    let currentLang = 'en-GB';
    const inputContainer = document.getElementById('inputContainer');

    function getNextWord(){
      if(reviewList.length) return reviewList.shift();
      currentIndex = (currentIndex + 1) % words.length;
      return words[currentIndex];
    }

    function nextRender() {
      delete wrongCountMap[words[currentIndex].name.toLowerCase()]
      const nextWord = getNextWord();
      words[currentIndex] = nextWord;
      loadWord();
    }
    
    function getTrans(arr) {
      if (!arr || !Array.isArray(arr)) return '';
      return arr.map(item => `<span>${item}</span>`).join('')
    }

    function loadWord(){
      const meaningEl = document.getElementById('meaning');
      const wordDisplay = document.getElementById('wordDisplay');
      const soundMark = document.getElementById('soundmark');
      const example = document.getElementById('example');
      

      const data = words[currentIndex];
      const word = data.name.toLowerCase();
      wordDisplay.textContent = word;
      meaningEl.innerHTML = getTrans(data.trans);
      inputContainer.innerHTML = '';
      const typeLang = {
        'en-US': 'usphone',  // 美音
        'en-GB': 'ukphone' // 英音
      }[currentLang] || 'ukphone'

      const languageStart = {
        'ukphone': '英: ', // BrE: 
        'usphone': '美: ' // AmE: 
      }
      soundMark.innerHTML = `${languageStart[typeLang]}&nbsp;/${data[typeLang]}/`
      data.lyrics && (example.innerHTML = `<div>${data.lyrics}</div><button class="sound-btn" data-type="lyrics">
        <svg class="speaker" viewBox="0 0 64 64" style="height: 32px" data-type="lyrics">
          <!-- 喇叭主体 -->
          <polygon points="16,24 28,24 40,12 40,52 28,40 16,40" data-type="lyrics" stroke-linejoin="round"/>
          <!-- 动态波纹 -->
          <g class="lyrics" data-type="lyrics" style="transform: translateX(6px);"></g>
        </svg>
      </button>`);

      for (let i = 0; i < word.length; i++) {
        let elem;
        if (!word[i].trim()) {
          elem = document.createElement('span');
          elem.textContent = word[i];
          elem.classList.add('placeholder');
        } else {
          elem = document.createElement('input');
          elem.maxLength = 1;
          elem.placeholder = word[i];
          elem.value = word[i];
        }
        inputContainer.appendChild(elem);
      }

      speakFemale(word, currentLang, document.getElementById('speaker'), document.getElementById('waves'));
    }

    // 渲染“列表版”
    function renderListView() {
      const grid = document.getElementById('listGrid');
      if (!grid) return;
      grid.innerHTML = '';

      words.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'list-card';

        // 顶部播放按钮（与 loadWord 的喇叭一致）
        const playBtn = document.createElement('button');
        playBtn.className = 'play-mini';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 64 64');
        svg.setAttribute('class', 'speaker');
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', '16,24 28,24 40,12 40,52 28,40 16,40');
        polygon.setAttribute('stroke-linejoin', 'round');
        const waves = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        waves.setAttribute('class', 'waves');
        waves.setAttribute('style', 'transform: translateX(6px);');
        svg.appendChild(polygon);
        svg.appendChild(waves);
        playBtn.appendChild(svg);
        playBtn.addEventListener('click', (ev) => {
          ev.stopPropagation(); // 与卡片点击区分
          ev.preventDefault();
          speakFemale(item.name, currentLang, svg, waves);
        });

        // 图片（如果有）
        if (item.img) {
          const img = document.createElement('img');
          img.src = item.img;
          img.alt = item.name || '';
          img.loading = 'lazy';
          card.appendChild(img);
        }

        // 英文单词（与 loadWord 的 wordDisplay 一致）
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = (item.name || '').toLowerCase();

        // 音标（与 loadWord 中 soundmark 一致）
        const sound = document.createElement('div');
        sound.style.marginTop = '6px';
        sound.style.color = '#777';
        sound.style.fontSize = '14px';
        const typeLang = ({ 'en-US': 'usphone', 'en-GB': 'ukphone' }[currentLang]) || 'ukphone';
        const languageStart = { ukphone: '英: ', usphone: '美: ' };
        const phone = item[typeLang] ? `/${item[typeLang]}/` : '';
        sound.innerHTML = `${languageStart[typeLang]}&nbsp;${phone}`;

        // 中文释义（与 loadWord 的 getTrans 一致）
        // const sub = document.createElement('div');
        // sub.className = 'sub';
        // sub.innerHTML = (Array.isArray(item.trans) ? item.trans.map(t => `<span>${t}</span>`).join('<br/>') : '');

        // 歌词按钮（如果有 lyrics）
        if (item.lyrics) {
          const lyrBtn = document.createElement('button');
          lyrBtn.className = 'play-mini';
          lyrBtn.style.marginTop = '8px';
          lyrBtn.style.backgroundColor = '#3498db';
          // 添加播放图标
          const lsvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          lsvg.setAttribute('viewBox', '0 0 64 64');
          lsvg.setAttribute('class', 'speaker');
          const lpoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          lpoly.setAttribute('points', '16,24 28,24 40,12 40,52 28,40 16,40');
          lpoly.setAttribute('stroke-linejoin', 'round');
          const lwaves = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          lwaves.setAttribute('class', 'waves');
          lwaves.setAttribute('style', 'transform: translateX(6px);');
          lsvg.appendChild(lpoly);
          lsvg.appendChild(lwaves);
          const ltext = document.createElement('span');
          ltext.textContent = ' 播放例句';
          ltext.style.marginLeft = '8px';
          lyrBtn.appendChild(lsvg);
          lyrBtn.appendChild(ltext);
          lyrBtn.addEventListener('click', (ev) => {
            ev.stopPropagation(); // 与卡片点击区分
            ev.preventDefault();
            speakFemale(item.lyrics, currentLang, lsvg, lwaves);
          });
          card.appendChild(lyrBtn);
        }

        card.appendChild(playBtn);
        card.appendChild(title);
        card.appendChild(sound);
        // card.appendChild(sub);
        // 点击卡片：播放 name + lyrics（若有）
        card.addEventListener('click', () => {
          const fullText = item.name + (item.lyrics ? ('. ' + item.lyrics) : '');
          speakFemale(fullText, currentLang, svg, waves);
        });
        grid.appendChild(card);
      });
    }

    document.addEventListener("click", function(ev) {
      const className = ev.target.classList.toString();
      let type = ev.target.getAttribute('data-type');
      type = type || ev.target.parentNode.getAttribute('data-type')

      switch (type) {
        case 'sound':
          speakFemale(words[currentIndex].name, currentLang, ev.target, document.getElementById('waves'));
          break;
        case 'lyrics':
          speakFemale(words[currentIndex].lyrics, currentLang, ev.target, ev.target.children[1]);
          break;
        case 'next':
          nextRender();
          break;
        case 'tabBtn': {
          // 切换 tab 样式
          const idx = ev.target.getAttribute('data-index');
          document.querySelectorAll('#tabContainer [data-type="tabBtn"]').forEach(btn => btn.classList.remove('active'));
          ev.target.classList.add('active');

          const wordWrap = document.querySelector('.wordContainer');
          const listWrap = document.getElementById('listContainer');

          if (idx === '1') {
            // 简便版
            listWrap.style.display = 'none';
            wordWrap.style.display = 'block';
            const next = document.getElementById('nextBtn');
            if (next) next.style.display = 'inline-block';
            // 切换到简便版时重新渲染一次
            try { loadWord(); } catch(e) {}
          } else {
            // 列表版
            wordWrap.style.display = 'none';
            listWrap.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
            renderListView();
          }
          break;
        }
      }
    }, false);

    function renderClassInfo(url = './data/school/waiYanShe.json') {
      $.ajax({
        url,
        type: 'GET',
        dataType: 'json',
        async: false
      }).done(function(data) {
        if (!data) return;
        words = Object.keys(data).reduce((acc, cur)=> [...acc, ...data[cur]], []);
        // 默认展示列表版
        try {
          renderListView();
          document.querySelector('.wordContainer').style.display = 'none';
          document.getElementById('listContainer').style.display = 'block';
          const next = document.getElementById('nextBtn');
          if (next) next.style.display = 'none';
        } catch (e) {
          // 兜底仍能正常显示单词
          loadWord();
        }
      }).fail(function(error) {
        console.error('Error fetching data', error);
      });
    }

    renderClassInfo(`./data/school/english-for-little-ones.json`);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>口算小工具</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #c7f3ff; /* 浅蓝背景，贴近示例 */
      margin: 0;
      padding: 8px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      background: transparent;
      border-radius: 16px;
      padding: 12px;
    }
    #settingsPanel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin: 8px 0 20px;
      font-size: 20px;
      text-align: center;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px 12px;
      margin: auto 12px;
      flex-direction: column;
      align-items: stretch;
      background: #fff;
      padding: 1.2rem;
      border-radius: 10px;
      width: 360px;
    }
    .controls label {
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .controls label span {
      width: 50px;
      text-align: right;
      flex: 0 0 50px;
    }
    .select, .input, .btn {
      border-radius: 8px;
      padding: 9px 14px;
      border: 1px solid #666;
      background: #fff;
      font-size: 14px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn {
      cursor: pointer;
      background: #fff7d6; /* 柔和黄 */
      border-color: #ffe49a;
      transition: all 0.2s ease;
      touch-action: manipulation;
      min-height: 40px;
      border-radius: 9999px; /* 胶囊按钮 */
    }
    .btn:hover, .btn:active {
      background: #ffe9a6;
      border-color: #ffd86b;
      color: #333;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .card {
      border: none;
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ebf8ff; /* 淡蓝卡片 */
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
    }
    .expr {
      font-size: 28px;
      letter-spacing: 1px;
      color: #333;
      min-width: 84px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap; /* PC 保持单行展示 */
      white-space: nowrap;
    }
    .expr .ans { /* 题内嵌输入框：圆角虚线风格 */
      width: 84px;
      height: 54px;
      text-align: center;
      font-size: 22px;
      border-radius: 12px;
      border: 2px dashed #9ac7ff;
      background: #e7f6ff;
      padding: 6px 8px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }
    .ans {
      width: 84px;
      height: 54px;
      text-align: center;
      font-size: 22px;
      border-radius: 12px;
      border: 2px dashed #9ac7ff;
      background: #e7f6ff;
      padding: 6px 8px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }
    .ans::-webkit-outer-spin-button,
    .ans::-webkit-inner-spin-button {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
    }
    .ans.correct {
      border-color: #28a745;
      color: #28a745;
      background: #e9f8ef;
    }
    .ans.wrong {
      border-color: #dc3545;
      color: #dc3545;
      background: #fdeff1;
    }
    .footer {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .score {
      font-size: 14px;
      color: #333;
    }
    .timer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #8a8a8a; /* 更淡的灰 */
      font-weight: 600;
      margin-left: 12px;
      padding: 8px 14px;
      background: #fff;
      border-radius: 9999px; /* 胶囊风格 */
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      border: none;
      font-variant-numeric: tabular-nums;
    }
    .timer::before {
      content: "";
      width: 18px;
      height: 18px;
      background-repeat: no-repeat;
      background-size: contain;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFC107'><path d='M7.88 3.39 6.6 2.1 4.1 4.6l1.27 1.27 2.51-2.48zM19.9 4.6l-2.5-2.5-1.28 1.29 2.5 2.5L19.9 4.6zM12 6a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm0 12.5A5.5 5.5 0 1 1 12 7.5a5.5 5.5 0 0 1 0 11z'/><path d='M12.75 9.5h-1.5v3.56l3.06 1.84.75-1.23-2.31-1.37V9.5z'/></svg>");
    }
    .tip {
      font-size: 12px;
      color: #777;
    }
    /* 结果页样式 */
    .results-header {
      display: flex;
      justify-content: center;
      margin: 6px 0 12px;
    }
    .final-score {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      color: #2ecc71; /* 绿色强调 */
      font-weight: 800;
      font-size: 26px;
      letter-spacing: .5px;
    }
    .final-score::before {
      content: "";
      width: 36px; 
      height: 36px;
      margin-top: 11px;
      background-repeat: no-repeat;
      background-size: contain;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23F1C40F' viewBox='0 0 24 24'><path d='M17 3h-2V2H9v1H7a1 1 0 0 0-1 1v2a4 4 0 0 0 3 3.87V12H6v2h4.08a4 4 0 0 0 3.84 0H18v-2h-3V9.87A4 4 0 0 0 18 6V4a1 1 0 0 0-1-1zm-8 3V5h6v1a2 2 0 1 1-6 0z'/></svg>");
    }
    .result-card {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 16px;
      background: linear-gradient(135deg, #eafaff, #ffffff);
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      border: 1px solid rgba(0,0,0,.04);
      margin-bottom: 12px;
    }
    .result-card-none {
      background: none;
      border: none;
      box-shadow: none;
    }
    .result-icon {
      width: 28px; height: 28px; flex: 0 0 28px;
      background-repeat: no-repeat; background-size: contain;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23F39C12' d='M17 3h-2V2H9v1H7a1 1 0 0 0-1 1v2a4 4 0 0 0 3 3.87V12H6v2h12v-2h-3V9.87A4 4 0 0 0 18 6V4a1 1 0 0 0-1-1z'/><path fill='%23F1C40F' d='M12 21a5 5 0 0 0 5-5H7a5 5 0 0 0 5 5z'/></svg>");
    }
    .result-title {
      font-size: 20px;
      font-weight: 800;
      color: #34495e;
    }
    #board {
      margin-top: 1rem;
      padding: 0.5rem;
    }
    /* 平板适配 */
    @media (max-width: 900px) {
      .grid { 
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .card {
        padding: 12px;
      }
      .expr {
        font-size: 24px;
        min-width: 70px;
      }
      .ans, .expr .ans {
        width: 76px;
        height: 50px;
        font-size: 20px;
      }
    }
    /* 移动端适配 */
    @media (max-width: 600px) {
      body {
        padding: 4px;
      }
      .container {
        padding: 10px;
        border-radius: 8px;
      }
      h1 {
        font-size: 20px;
        margin: 12px 0 20px;
      }
      #board {
        padding: 0;
      }
      #quizPanel .controls { 
        padding: 0;
      }
      .controls {
        gap: 20px 8px;
        background: transparent;
      }
      .select, .input, .btn {
        padding: 8px 12px;
        font-size: 14px;
        min-height: 38px;
      }
      .grid { 
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .card {
        padding: 12px;
        flex-direction: column;
        gap: 10px;
      }
      .expr {
        font-size: 22px;
        min-width: auto;
        width: 100%;
        justify-content: center;
      }
      .ans, .expr .ans {
        width: 72px;
        height: 48px;
        font-size: 18px;
        padding: 8px;
        min-height: 42px;
      }
      .footer {
        margin-top: 12px;
        justify-content: center;
      }
      .score {
        font-size: 14px;
      }
      .tip {
        font-size: 12px;
        display: block;
        width: 100%;
        text-align: center;
        margin-top: 4px;
      }
    }
    /* 小屏手机适配 */
    @media (max-width: 400px) {
      .grid { 
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .card {
        flex-direction: row;
        justify-content: space-between;
      }
      .expr { font-size: 18px; }
      .ans, .expr .ans { max-width: 70px; }
      #board {
        padding: 0;
      }
      #quizPanel .controls { 
        padding: 0;
      }
      .controls {
        background: transparent;
      }
      .controls label {
        width: 100%;
      }
      .select, .input {
        width: 100%;
      }
      .btn {
        width: 100%;
      }
    }
    /* 打印样式 */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      #quizPanel .controls,
      #settingsPanel,
      #resultsPanel {
        display: none !important;
      }
      #board {
        margin: 0;
        padding: 0;
      }
      .card {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .grid {
        grid-template-columns: repeat(4, 1fr) !important;
      }
      .ans {
        border: 2px solid #333 !important;
        background: transparent !important;
        color: #000 !important;
      }
      .ans.correct,
      .ans.wrong {
        border: 2px solid #333 !important;
        background: transparent !important;
        color: #000 !important;
      }
    }
  </style>
</head>
<body>
  <!-- [input] + b = c
  a + [input] = c
  a + b = [input] -->
  <div class="container">
    <div id="settingsPanel">
      <h1>
        口算小工具
        <span class="tip">提示：按回车可快速判分</span>
      </h1>
      <div class="controls">
        <label>
          <span>上限：</span>
          <select id="maxSel" class="select">
            <option value="5">5以内</option>
            <option value="10">10以内</option>
            <option value="20" selected>20以内</option>
            <option value="50">50以内</option>
            <option value="70">70以内</option>
            <option value="90">90以内</option>
            <option value="100">100以内</option>
            <option value="custom">自定义</option>
          </select>
          <input
            id="customMax"
            class="input"
            type="number"
            placeholder="自定义上限(5-100)"
            min="5"
            max="100"
            disabled
            style="display:none;"
          />
        </label>
        <label>
          <span>题量：</span>
          <select id="countSel" class="select">
            <option value="5">5题</option>
            <option value="10">10题</option>
            <option value="20" selected>20题</option>
            <option value="25">25题</option>
            <option value="30">30题</option>
            <option value="50">50题</option>
            <option value="70">70题</option>
            <option value="90">90题</option>
            <option value="100">100题</option>
            <option value="custom">自定义</option>
          </select>
          <input
            id="customCount"
            class="input"
            type="number"
            placeholder="自定义题量(1-200)"
            min="1"
            max="200"
            disabled
            style="display:none;"
            />
        </label>
        <div style="display: flex; gap: 12px; align-items: center;">
          <label style="gap: 0; cursor: pointer;">
            <input id="plusCb" type="checkbox" checked /> 加法
          </label>
          <label style="gap: 0; cursor: pointer;">
            <input id="minusCb" type="checkbox" checked /> 减法
          </label>
          <label style="gap: 0; cursor: pointer;">
            <input id="mulCb" type="checkbox" /> 乘法
          </label>
          <label style="gap: 0; cursor: pointer;">
            <input id="divCb" type="checkbox" /> 除法
          </label>
        </div>
        <label>
          <span>类型：</span>
          <select id="typeSel" class="select">
            <option value="custom" selected>默认</option>
            <option value="addsub">混合加减法</option>
            <option value="all">混合加减乘除</option>
          </select>
        </label>
        <label id="digitLabel" style="display:none;">
          <span>位数：</span>
          <select id="digitSel" class="select">
            <option value="2" selected>两位运算</option>
            <option value="3">三位运算</option>
            <option value="4">四位运算</option>
          </select>
        </label>
        <label style="margin-top: 0.25rem;">
          <button id="genBtn" class="btn" style="width: 100%;">生成题目</button>
        </label>
      </div>

      <div id="customEditor" style="display:none; margin: 8px 0;">
      <textarea id="customProblems" class="input" placeholder="每行一题，例如：\n3 + 4\n10 - 口 = 5\n口 + 7 = 12\n8 + 6 = 口\n3 × 4 = 口\n口 × 5 = 15\n20 ÷ 口 = 4" rows="6" style="width:100%; resize: vertical;"></textarea>
      <div class="tip">提示：支持“+/-/×/÷”或“*//”，支持在任意一侧用“口”留空（a、b、或结果）。</div>
      </div>
    </div>

    <div id="quizPanel" style="display:none;">
      <div class="controls" style="flex-direction: initial; width: 98.5%;">
        <div id="timer" class="timer">00:00</div>
        <div style="width: 92%; display: flex; gap: 1rem;">
          <!-- <button id="checkBtn" class="btn">判分</button> -->
          <button id="resetTimerBtn" class="btn">重新计时</button>
          <button id="printBtn" class="btn">打印</button>
          <button id="downBtn" class="btn">下载</button>
        </div>
      </div>

      <div id="board" style="margin-top: 1rem;"></div>
    </div>

    <div id="resultsPanel" style="display:none; flex-direction: column;">
      <!-- <div class="result-card result-card-none">
        <div class="result-icon"></div>
        <div class="result-title">结果</div>
      </div> -->
      <div class="results-header">
        <div id="finalScore" class="final-score">成绩：0 / 0</div>
      </div>
      <div id="wrongList" style="margin-top:10px;"></div>
      <div style="margin-top:12px;">
        <button id="backToSettings" class="btn" style="width: 100%;">重新出题</button>
      </div>
    </div>
  </div>
  <script>
    function clamp(n, min, max){
      n = Number(n);
      if (Number.isNaN(n)) return min;
      return Math.min(max, Math.max(min, Math.floor(n)));
    }
    function randInt(min, max){
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    // 计算多步骤运算结果（考虑运算优先级：先乘除后加减）
    function calculateMultiStep(nums, ops){
      // 先计算所有乘除（从左到右）
      const values = [...nums];
      const operators = [...ops];
      
      // 先处理乘除
      let i = 0;
      while (i < operators.length) {
        if (operators[i] === '×' || operators[i] === '÷') {
          const left = values[i];
          const right = values[i + 1];
          let result;
          if (operators[i] === '×') {
            result = left * right;
          } else {
            result = left / right;
            // 确保除法结果是整数
            if (result % 1 !== 0) {
              return NaN; // 不是整数，返回NaN
            }
          }
          // 替换两个数字为一个结果
          values.splice(i, 2, result);
          operators.splice(i, 1);
        } else {
          i++;
        }
      }
      
      // 再计算所有加减（从左到右）
      let result = values[0];
      for (let j = 0; j < operators.length; j++) {
        if (operators[j] === '+') {
          result = result + values[j + 1];
        } else if (operators[j] === '-') {
          result = result - values[j + 1];
        }
      }
      return result;
    }
    
    // 生成多步骤运算题目（两位=a+b，三位=a+b-c，四位=a+b×c-d）
    function makeMultiStep(max, steps, ops, type, retryCount = 0){
      if (retryCount > 20) {
        // 防止无限递归，如果重试超过20次，降级为两位运算
        return makeMultiStep(max, 2, ['+'], 'addsub', 0);
      }
      
      const stepsNum = steps || 2; // 默认两位运算
      const availableOps = ops || [];
      if (availableOps.length === 0) availableOps.push('+'); // 至少加法
      
      const nums = [];
      const operators = [];
      
      // 生成第一个数字
      const firstNum = randInt(1, Math.min(max, 50));
      nums.push(firstNum);
      
      // 生成后续数字和运算符
      for (let i = 1; i < stepsNum; i++) {
        const op = availableOps[randInt(0, availableOps.length - 1)];
        operators.push(op);
        
        let nextNum;
        if (op === '+') {
          nextNum = randInt(1, Math.min(max, 50));
        } else if (op === '-') {
          nextNum = randInt(1, Math.min(max, 50));
        } else if (op === '×') {
          nextNum = randInt(1, Math.min(10, max));
        } else if (op === '÷') {
          // 对于除法，需要确保能够整除
          // 先计算当前的结果，然后选择一个能整除的数作为除数
          const currentResult = calculateMultiStep([...nums], [...operators]);
          if (isNaN(currentResult) || currentResult <= 0) {
            // 如果当前结果不合理，重新生成
            return makeMultiStep(max, steps, ops, type, retryCount + 1);
          }
          // 选择一个能整除 currentResult 的除数
          const divisors = [];
          for (let d = 1; d <= Math.min(10, currentResult); d++) {
            if (currentResult % d === 0) {
              divisors.push(d);
            }
          }
          if (divisors.length === 0) {
            // 如果没有合适的除数，重新生成
            return makeMultiStep(max, steps, ops, type, retryCount + 1);
          }
          nextNum = divisors[randInt(0, divisors.length - 1)];
        }
        nums.push(nextNum);
      }
      
      // 计算最终结果（考虑运算优先级）
      let result = calculateMultiStep([...nums], [...operators]);
      
      // 检查结果是否合理
      if (result > max || result < 0 || isNaN(result) || !isFinite(result) || result % 1 !== 0) {
        // 如果结果超出范围或不是整数，重新生成
        return makeMultiStep(max, steps, ops, type, retryCount + 1);
      }
      
      // 随机决定空位位置（0表示结果，1-4表示第几个数字）
      const blankPos = randInt(0, stepsNum);
      
      return {
        nums: nums,
        ops: operators,
        result: Math.round(result),
        blank: blankPos,
        steps: stepsNum
      };
    }

    function makeAdd(max, digits = null){
      if (digits) {
        const range = getRangeByDigits(digits);
        // 确保 a 和 b 的和不会超过 max
        const aMax = Math.min(range.max, max - range.min);
        if (aMax < range.min) {
          // 如果上限太小，无法生成符合位数的加法，降级处理
          const a = randInt(0, max);
          const b = randInt(0, max - a);
          return { a, b, op: '+', result: a + b };
        }
        const a = randInt(range.min, aMax);
        const bMax = Math.min(range.max, max - a);
        const b = bMax >= range.min ? randInt(range.min, bMax) : randInt(range.min, Math.min(max - a, range.max));
        // 确保结果不超过 max
        if (a + b > max) {
          const bAdjusted = Math.max(0, max - a);
          return { a, b: bAdjusted, op: '+', result: a + bAdjusted };
        }
        return { a, b, op: '+', result: a + b };
      }
      const a = randInt(0, max);
      const b = randInt(0, max - a); // 保证和不超上限
      return { a, b, op: '+', result: a + b };
    }
    function makeSub(max, digits = null){
      if (digits) {
        const range = getRangeByDigits(digits);
        // 确保 a >= b，且结果在合理范围
        const aMax = Math.min(range.max, max + range.max); // a 可以超过 max，只要 b 也大
        if (aMax < range.min) {
          // 如果上限太小，无法生成符合位数的减法，降级处理
          const a = randInt(0, max);
          const b = randInt(0, a);
          return { a, b, op: '-', result: a - b };
        }
        const a = randInt(range.min, Math.min(aMax, max + range.max));
        const b = randInt(range.min, Math.min(a, range.max)); // 保证不为负
        return { a, b, op: '-', result: a - b };
      }
      const a = randInt(0, max);
      const b = randInt(0, a); // 保证不为负
      return { a, b, op: '-', result: a - b };
    }
    function makeMul(max, digits = null, retryCount = 0){
      if (retryCount > 10) {
        // 防止无限递归，如果重试超过10次，降低要求
        const a = randInt(1, Math.min(max, 10));
        const bMax = Math.floor(max / a);
        const b = randInt(1, Math.max(1, bMax));
        return { a, b, op: '×', result: a * b };
      }
      
      if (digits) {
        const range = getRangeByDigits(digits);
        // 确保 a 不会太大，导致结果必然超过 max
        const aMax = Math.min(range.max, Math.floor(max / range.min));
        if (aMax < range.min) {
          // 如果上限太小，无法生成符合位数的乘法，降级处理
          const a = randInt(1, Math.min(max, 10));
          const bMax = Math.floor(max / a);
          const b = randInt(1, Math.max(1, bMax));
          return { a, b, op: '×', result: a * b };
        }
        const a = randInt(range.min, aMax);
        const bMax = Math.min(Math.floor(max / a), range.max);
        if (bMax < 1) {
          // 如果 bMax 小于 1，重新生成（降低要求）
          return makeMul(max, digits, retryCount + 1);
        }
        const b = bMax >= range.min ? randInt(range.min, bMax) : randInt(1, bMax);
        const result = a * b;
        if (result > max) {
          // 如果结果超出上限，重新生成
          return makeMul(max, digits, retryCount + 1);
        }
        return { a, b, op: '×', result: result };
      }
      const a = randInt(1, Math.min(max, 10)); // 乘数限制在1-10，避免结果过大
      const bMax = Math.floor(max / a); // 保证积不超过上限
      const b = randInt(1, Math.max(1, bMax));
      return { a, b, op: '×', result: a * b };
    }
    function makeDiv(max, digits = null, retryCount = 0){
      if (retryCount > 10) {
        // 防止无限递归，如果重试超过10次，降低要求
        const result = randInt(1, Math.min(max, 10));
        const b = randInt(1, Math.min(max, 10));
        const a = result * b;
        return { a, b, op: '÷', result: result };
      }
      
      if (digits) {
        const range = getRangeByDigits(digits);
        // 确保除数不会太大，导致被除数必然超过 max
        const bMax = Math.min(range.max, Math.floor(max / 1));
        if (bMax < range.min) {
          // 如果上限太小，无法生成符合位数的除法，降级处理
          const result = randInt(1, Math.min(max, 10));
          const b = randInt(1, Math.min(max, 10));
          const a = result * b;
          return { a, b, op: '÷', result: result };
        }
        // 先确定除数（在位数范围内），再确定商，最后计算被除数
        const b = randInt(range.min, bMax);
        const maxResult = Math.min(Math.floor(max / b), 10); // 商限制在合理范围
        if (maxResult < 1) {
          // 如果 maxResult 小于 1，重新生成（降低要求）
          return makeDiv(max, digits, retryCount + 1);
        }
        const result = randInt(1, Math.max(1, maxResult));
        const a = result * b;
        if (a > range.max || a > max) {
          // 如果超出上限，重新生成
          return makeDiv(max, digits, retryCount + 1);
        }
        return { a, b, op: '÷', result: result };
      }
      // 先确定结果，再反推被除数和除数
      const result = randInt(1, Math.min(max, 10));
      const b = randInt(1, Math.min(max, 10));
      const a = result * b;
      if (a > max) {
        // 如果超出上限，重新生成
        return makeDiv(max, null, retryCount + 1);
      }
      return { a, b, op: '÷', result: result };
    }
    function genProblems(count, max, type, useAdd, useSub, useMul, useDiv, steps = null){
      const list = [];
      
      // 如果选择了混合类型且有步数选择，使用多步骤运算
      if ((type === 'addsub' || type === 'all') && steps) {
        const availableOps = [];
        if (type === 'addsub') {
          availableOps.push('+', '-');
        } else {
          availableOps.push('+', '-', '×', '÷');
        }
        
        const seen = new Set();
        let guard = 0;
        while(list.length < count && guard < count * 50){
          guard++;
          const p = makeMultiStep(max, steps, availableOps, type);
          const key = JSON.stringify(p);
          if (seen.has(key)) continue;
          seen.add(key);
          list.push(p);
        }
        return list;
      }
      
      // 否则使用原来的两位运算逻辑
      const makers = [];
      if (type === 'addsub') {
        makers.push(
          (max) => makeAdd(max, null),
          (max) => makeSub(max, null)
        );
      } else if (type === 'all') {
        makers.push(
          (max) => makeAdd(max, null),
          (max) => makeSub(max, null),
          (max) => makeMul(max, null),
          (max) => makeDiv(max, null)
        );
      } else {
        // 自定义：根据复选框选择
        if (useAdd) makers.push((max) => makeAdd(max, null));
        if (useSub) makers.push((max) => makeSub(max, null));
        if (useMul) makers.push((max) => makeMul(max, null));
        if (useDiv) makers.push((max) => makeDiv(max, null));
      }
      
      if (!makers.length) makers.push((max) => makeAdd(max, null)); // 至少加法
      const seen = new Set();
      let guard = 0;
      while(list.length < count && guard < count * 50){
        guard++;
        const maker = makers[randInt(0, makers.length - 1)];
        const p = maker(max);
        const key = `${p.a}${p.op}${p.b}`;
        if (seen.has(key)) continue;
        seen.add(key);
        // 随机决定空位位置：结果/左操作数/右操作数
        const blanks = ['result', 'a', 'b'];
        p.blank = blanks[randInt(0, blanks.length - 1)];
        list.push(p);
      }
      return list;
    }

    // 解析自定义题目为标准题目结构 {a,b,op,result,blank}
    function parseCustomProblems(text){
      const lines = (text || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
      const result = [];
      for (const line of lines) {
        try {
          // 支持四种运算符：+ - * / 或 × ÷
          // 1) a op b
          // 2) a op b = 口
          // 3) 口 op b = c / a op 口 = c
          const eqParts = line.split('=').map(s => s.trim());
          let a, b, op, res, blank;
          // 统一运算符：* 转 ×，/ 转 ÷
          const normalizedLine = line.replace(/\*/g, '×').replace(/\//g, '÷');
          const normalizedParts = normalizedLine.split('=').map(s => s.trim());
          
          if (normalizedParts.length === 1) {
            // 只有左侧：a op b
            const m = normalizedParts[0].match(/^(.+)([+\-×÷])(.*)$/);
            if (!m) continue;
            a = m[1].trim(); op = m[2]; b = m[3].trim();
            if (a === '口') { blank = 'a'; a = NaN; }
            if (b === '口') { blank = 'b'; b = NaN; }
            // 默认结果空
            if (!blank) blank = 'result';
            a = Number(a); b = Number(b);
            if (Number.isNaN(a) || Number.isNaN(b)) continue;
            if (op === '+') res = a + b;
            else if (op === '-') res = a - b;
            else if (op === '×') res = a * b;
            else if (op === '÷') res = a / b;
            else continue;
          } else {
            // 含等号：LHS = RHS
            const lhs = normalizedParts[0];
            const rhs = normalizedParts[1];
            const m = lhs.match(/^(.+)([+\-×÷])(.*)$/);
            if (!m) continue;
            let la = m[1].trim(), lop = m[2], lb = m[3].trim();
            op = lop;
            if (rhs === '口') {
              // a op b = 口
              blank = 'result';
              a = Number(la); b = Number(lb);
              if (Number.isNaN(a) || Number.isNaN(b)) continue;
              if (op === '+') res = a + b;
              else if (op === '-') res = a - b;
              else if (op === '×') res = a * b;
              else if (op === '÷') res = a / b;
              else continue;
            } else if (la === '口' || lb === '口') {
              // 口 op b = c  或 a op 口 = c
              const c = Number(rhs);
              if (Number.isNaN(c)) continue;
              if (la === '口') {
                blank = 'a';
                b = Number(lb);
                if (Number.isNaN(b)) continue;
                res = c;
                if (op === '+') a = c - b;
                else if (op === '-') a = c + b;
                else if (op === '×') a = c / b;
                else if (op === '÷') a = c * b;
                else continue;
              } else {
                blank = 'b';
                a = Number(la);
                if (Number.isNaN(a)) continue;
                res = c;
                if (op === '+') b = c - a;
                else if (op === '-') b = a - c;
                else if (op === '×') b = c / a;
                else if (op === '÷') b = a / c;
                else continue;
              }
            } else {
              // a op b = c
              blank = 'result';
              a = Number(la); b = Number(lb); res = Number(rhs);
              if (Number.isNaN(a) || Number.isNaN(b) || Number.isNaN(res)) continue;
            }
          }
          result.push({ a, b, op, result: res, blank });
        } catch(e) { /* ignore bad line */ }
      }
      return result;
    }

    function checkSingle(input, container, timerEl){
      const val = input.value.trim();
      const correct = Number(input.dataset.correct);
      const ok = val !== '' && Number(val) === correct;
      input.classList.remove('correct', 'wrong');
      if (val !== '') {
        input.classList.add(ok ? 'correct' : 'wrong');
      }
      updateScore(container, timerEl);
      
      // 答对后自动跳到下一题
      if (ok) {
        const inputs = container.querySelectorAll('.ans');
        const currentIdx = Array.from(inputs).indexOf(input);
        const nextInput = inputs[currentIdx + 1];
        if (nextInput && !nextInput.disabled) {
          setTimeout(function(){
            nextInput.focus();
          }, 200);
        }
      }
    }
    
    function updateScore(container, timerEl){
      const inputs = container.querySelectorAll('.ans');
      let correct = 0;
      let answered = 0;
      inputs.forEach(inp => {
        const val = inp.value.trim();
        if (val !== '') {
          answered++;
          const ok = Number(val) === Number(inp.dataset.correct);
          if (ok) correct++;
        }
      });
      if (answered !== 0 && timerEl && answered === inputs.length) {
        stopTimer(timerEl);
        // 展示结果页
        const final = document.getElementById('finalScore');
        const wrongList = document.getElementById('wrongList');
        if (final) final.textContent = `成绩：${correct} / ${inputs.length}`;
        if (wrongList) {
          wrongList.innerHTML = '';
          const ul = document.createElement('div');
          inputs.forEach((inp, idx) => {
            const val = inp.value.trim();
            const ok = val !== '' && Number(val) === Number(inp.dataset.correct);
            if (!ok) {
              const p = currentProblems[idx];
              let holeText;
              
              // 判断是否为多步骤运算
              if (p.nums && p.ops) {
                // 多步骤运算
                const nums = p.nums;
                const ops = p.ops;
                let exprParts = [];
                for (let i = 0; i < nums.length; i++) {
                  if (p.blank === i + 1) {
                    exprParts.push('口');
                  } else {
                    exprParts.push(String(nums[i]));
                  }
                  if (i < ops.length) {
                    exprParts.push(` ${ops[i]} `);
                  }
                }
                if (p.blank === 0) {
                  exprParts.push(' = 口');
                } else {
                  exprParts.push(` = ${p.result}`);
                }
                holeText = exprParts.join('');
              } else {
                // 两位运算
                holeText = p.blank === 'a' ? `口 ${p.op} ${p.b} = ${p.result}`
                  : (p.blank === 'b' ? `${p.a} ${p.op} 口 = ${p.result}` : `${p.a} ${p.op} ${p.b} = 口`);
              }
              
              const row = document.createElement('div');
              row.className = 'card';
              row.style.flexDirection = 'column';
              row.style.marginBottom = '8px';
              row.innerHTML = `<div class=\"tip\">你的答案：${val || '空'}，正确：${inp.dataset.correct}</div><div style=\"font-size:18px;\">${holeText}</div>`;
              ul.appendChild(row);
            }
          });
          wrongList.appendChild(ul);
        }
        showResults();
      }
    }
    
  function formatTime(seconds){
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    
    function startTimer(timerEl){
      if (timerEl.timerInterval) {
        clearInterval(timerEl.timerInterval);
      }
      timerEl.startTime = Date.now();
      timerEl.timerInterval = setInterval(function(){
        const elapsed = Math.floor((Date.now() - timerEl.startTime) / 1000);
        timerEl.textContent = `${formatTime(elapsed)}`;
      }, 100);
    }
    
    function stopTimer(timerEl){
      if (timerEl.timerInterval) {
        clearInterval(timerEl.timerInterval);
        timerEl.timerInterval = null;
      }
    }
    
    function resetTimer(timerEl){
      stopTimer(timerEl);
      timerEl.textContent = '00:00';
      timerEl.startTime = null;
    }
    
  function renderProblems(container, problems, timerEl){
      container.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'grid';
    // 保存当前题目集供结果统计
    currentProblems = problems.slice();
      
      // 启动计时的函数（仅在无计时器时启动）
      function tryStartTimer(){
        if (timerEl && !timerEl.timerInterval) {
          startTimer(timerEl);
        }
      }
      
      problems.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        const expr = document.createElement('div');
        expr.className = 'expr';
        // 构建输入框
        const input = document.createElement('input');
        input.className = 'ans';
        input.setAttribute('type', 'number');
        input.setAttribute('inputmode', 'numeric');
        input.setAttribute('aria-label', `第${idx+1}题`);
        
        // 判断是否为多步骤运算
        if (p.nums && p.ops) {
          // 多步骤运算：p.nums = [a, b, c, d], p.ops = ['+', '-', '×'], p.blank = 0-4
          const nums = p.nums;
          const ops = p.ops;
          let correctValue;
          
          if (p.blank === 0) {
            // 结果为空
            correctValue = p.result;
          } else {
            // 某个数字为空（blank 是 1-based 索引）
            correctValue = nums[p.blank - 1];
          }
          input.dataset.correct = String(correctValue);
          
          // 渲染多步骤表达式
          for (let i = 0; i < nums.length; i++) {
            if (p.blank === i + 1) {
              // 当前数字为空，插入输入框
              expr.appendChild(input);
            } else {
              // 显示数字
              expr.appendChild(document.createTextNode(String(nums[i])));
            }
            // 添加运算符（除了最后一个数字）
            if (i < ops.length) {
              expr.appendChild(document.createTextNode(` ${ops[i]} `));
            }
          }
          // 添加等号和结果（或输入框）
          if (p.blank === 0) {
            // 结果为空，在等号后添加输入框
            expr.appendChild(document.createTextNode(' = '));
            expr.appendChild(input);
          } else {
            // 数字为空，显示结果
            expr.appendChild(document.createTextNode(` = ${p.result}`));
          }
        } else {
          // 两位运算：原有的逻辑
          const correctValue = p.blank === 'a' ? p.a : (p.blank === 'b' ? p.b : p.result);
          input.dataset.correct = String(correctValue);

          // 根据空位位置渲染：当空在 a/b 时，把 input 嵌入表达式；空在 result 时，input 放等号后
          if (p.blank === 'a') {
            // [input] op b = result
            expr.appendChild(input);
            expr.appendChild(document.createTextNode(` ${p.op} ${p.b} = ${p.result}`));
          } else if (p.blank === 'b') {
            // a op [input] = result
            expr.appendChild(document.createTextNode(`${p.a} ${p.op} `));
            expr.appendChild(input);
            expr.appendChild(document.createTextNode(` = ${p.result}`));
          } else {
            // a op b = [input]（将输入框嵌入表达式内部，避免右侧分离）
            expr.appendChild(document.createTextNode(`${p.a} ${p.op} ${p.b} = `));
            expr.appendChild(input);
          }
        }
        
        // 输入完成时立即判分（失去焦点时）
        input.addEventListener('blur', function(){
          checkSingle(input, container, timerEl);
        });
        
        // 输入时实时判分（当输入值长度足够时）
        input.addEventListener('input', function(e){
          const val = e.target.value.trim();
          if (val !== '') {
            tryStartTimer();
            // 延迟一小段时间，避免在输入过程中频繁判分
            clearTimeout(e.target.checkTimer);
            e.target.checkTimer = setTimeout(function(){
              checkSingle(input, container, timerEl);
            }, 300);
          }
        });
        
        input.addEventListener('keydown', function(e){
          if (e.key === 'Enter') {
            checkSingle(input, container, timerEl);
            // 如果已经是最后一题，不自动跳转
            const inputs = container.querySelectorAll('.ans');
            const currentIdx = Array.from(inputs).indexOf(input);
            if (currentIdx < inputs.length - 1) {
              const nextInput = inputs[currentIdx + 1];
              if (nextInput && !nextInput.disabled) {
                setTimeout(function(){
                  nextInput.focus();
                }, 100);
              }
            }
          }
        });
        
        card.appendChild(expr);
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

                  // 当前数字为空
                  exprText += '（　　）';
                } else {
                  exprText += nums[k];
                }
                if (k < ops.length) {
                  exprText += ' ' + ops[k] + ' ';
                }
              }
              
              if (p.blank === 0) {
                exprText += ' = （　　）';
              } else {
                exprText += ' = ' + p.result;
              }
            } else {
              // 两位运算
              const opSymbol = p.op === '+' ? '+' : (p.op === '-' ? '−' : (p.op === '*' ? '×' : '÷'));
              if (p.blank === 'a') {
                exprText = `（　　） ${opSymbol} ${p.b} = ${p.result}`;
              } else if (p.blank === 'b') {
                exprText = `${p.a} ${opSymbol} （　　） = ${p.result}`;
              } else {
                exprText = `${p.a} ${opSymbol} ${p.b} = （　　）`;
              }
            }
            
            htmlContent += `<td class="expr">${exprText}</td>`;
          }
          // 如果最后一行不足 4 列，填充空单元格
          const remainingCols = colsPerRow - (currentProblems.length - i);
          for (let k = 0; k < remainingCols && remainingCols < colsPerRow; k++) {
            htmlContent += '<td></td>';
          }
          htmlContent += '</tr>';
        }
        
        htmlContent += '</table>';
        htmlContent += '<p style="text-align: center; margin-top: 30px; color: #7f8c8d;">共 ' + currentProblems.length + ' 道题</p>';
        htmlContent += '</body></html>';
        
        // 创建 Blob 并下载
        const blob = new Blob(['\ufeff', htmlContent], {
          type: 'application/msword'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '口算练习题_' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.doc';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      // 绑定打印与下载按钮
      const printBtn = document.getElementById('printBtn');
      const downBtn = document.getElementById('downBtn');
      printBtn && printBtn.addEventListener('click', function(){ window.print(); });
      downBtn && downBtn.addEventListener('click', function(){ exportToWord(); });
      
      maxSel.addEventListener('change', function(){
        const isCustom = maxSel.value === 'custom';
        customMax.disabled = !isCustom;
        customMax.style.display = isCustom ? '' : 'none';
      });

      countSel.addEventListener('change', function(){
        const isCustom = countSel.value === 'custom';
        const customCount = document.getElementById('customCount');
        const editor = document.getElementById('customEditor');
        customCount.disabled = !isCustom;
        customCount.style.display = isCustom ? '' : 'none';
        editor.style.display = isCustom ? '' : 'none';
      });

      typeSel.addEventListener('change', function(e){
        const type = typeSel.value;
        const isMixed = type === 'addsub' || type === 'all';
        digitLabel.style.display = isMixed ? '' : 'none';
      });
      
      // 监听checkbox变化，但不触发typeSel的change
      [plusCb, minusCb, mulCb, divCb].forEach(cb => {
        cb.addEventListener('change', function(e){
          // 阻止事件冒泡，避免触发typeSel的change
          e.stopPropagation();
        });
      });

    // 初始展示设置面板
    showSettings();

    // 结果页返回设置
    const backBtn = document.getElementById('backToSettings');
    backBtn && backBtn.addEventListener('click', function(){
      showSettings();
      // 清理板与分数
      board.innerHTML = '';
      
      resetTimer(timer);
    });
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

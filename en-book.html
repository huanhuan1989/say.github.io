<!DOCTYPE html>
<html lang = "zh">
<head>
  <meta charset = "UTF-8">
  <meta name = "viewport" content = "width = device-width,initial-scale = 1.0" />
  <title>外研社英语课本单词学习及默写</title>
  <style>
    /* 整个滚动条 */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    /* 滚动条轨道 */
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    /* 滚动条滑块 */
    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 10px;
    }

    /* 滑块在鼠标悬停时的样式 */
    ::-webkit-scrollbar-thumb:hover {
      background: #555;
      cursor: pointer;
    }
    body {
      font-family:Arial,sans-serif;
      text-align:center;
      background:#f7f7f7;
      overflow: hidden;
    }
    .head {
      margin-bottom: 12px;
    }
    .appContainer {
      display: flex;
    }
    .tabs {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 84vh;
    }
    .tabs .tabs-main {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-right: 10px;
    }
    .tabs button {
      margin:4px;
      padding:10px 14px;
      border:none;
      background:#eee;
      cursor:pointer;
      border-radius:6px;
      max-width: 200px;
    }
    .tabs button.active {
      background:#007bff;
      color:#fff;
    }
    .mainContainer {
      margin: 20% 12px auto 12px;
      flex: 1;
      font-size: 0;
    }
    .control-select {
      cursor: pointer;
      border-radius: 8px;
      padding: 9px 14px;
      border: 1px solid #666;
      margin: 0 6px;
    }
    #levelSelect {
      padding: 6px 10px;
      border-radius: 6px;
    }
    #inputContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    #inputContainer input {
      width: 40px;
      height: 50px;
      font-size: 48px;
      text-align:center;
      margin: 1px;
      padding: 4px;
      text-transform:lowercase;
      border-radius:6px;
      border: none;
      outline: none;
      background-color: transparent;
      border-bottom: 5px solid #333;
      cursor: pointer;
      font-weight: 700;
      caret-color: green;
      animation: blink 1s infinite;
      -webkit-input-placeholder {
        cursor: text;
        font-weight: 700;;
      }
    }
    @keyframes blink {
      0%, 100% { caret-color: #007bff; }
      50% { caret-color: transparent; }
    }
    #inputContainer input::placeholder {
      color: #555;
    }
    #inputContainer input:focus {
      outline: none;
      border-bottom-color: #007bff;
    }
    
    .hidden-placeholder::placeholder {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .hidden-placeholder:hover::placeholder,
    #inputContainer:hover .hidden-placeholder::placeholder {
      opacity: 1;
    }
    #inputContainer .placeholder {
      width: 30px;
      height: 52px;
      display: block;
      color: #333;
    }
    #inputContainer.easy input {
      border: none;
      background-color: transparent;
    }
    #inputContainer.easy input:focus {
      outline: none;
      border: none;
    }
    .correct {
      border-color:green;
      color:green;
    }
    .wrong {
      border-color:red;
      color:red;
    }
    button.control-btn {
      padding:10px 14px;
      background: #eee;
      color: #333;
      border:none;
      cursor:pointer;
      border-radius:8px;
      font-size:12px;
      margin: 12px 4px;
    }
    button.control-btn:hover,
    button.active {
      background: #007bff;
      color: #fff;
    }
    /* 与按钮风格一致的下拉框样式 */
    .select {
      padding:10px 14px;
      background:#eee;
      color:#333;
      border:none;
      cursor:pointer;
      border-radius:8px;
      font-size:12px;
      margin: 12px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      outline: none;
    }
    .select:hover,
    .select:focus {
      background:#007bff;
      color:#fff;
      outline: none;
    }
    .select option {
      color:#333;
    }
    .wordContainer {
      display: flex;
      font-size: 20px;
      color: #333;
      margin: 24px 0;
      justify-content: center;
      flex-direction: column;
    }
    #wordDisplay {
      font-size: 48px;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }
    #meaning {
      font-size: 18px;
      display: flex;
      flex-direction: column;
    }
    #meaning span {
      margin-bottom: 12px;
    }
    .toolContainer {
      display: flex;
      justify-content: center;
    }
    .sound-btn {
      background: transparent;
      border: none;
      outline: none;
      margin-left: 12px;
      cursor: pointer;
    }
    #speakerPath {
      animation: flash 1s infinite; /* 1秒循环，无限播放 */
    }
    @keyframes flash {
      0% { fill: #FF5733; } /* 初始颜色 */
      50% { fill: #FFC300; } /* 中间颜色 */
      100% { fill: #FF5733; } /* 回到初始颜色 */
    }
    
    #soundmark {
      font-size: 14px;
      margin-bottom: 12px;
      color: #777;
    }
    .speaker {
      height: 34px; /* 你可以改为任意尺寸 */
      width: auto;
      cursor: pointer;
      fill: none;
      stroke: #333;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke 0.3s ease;
    }
    .speaker:hover {
      stroke: #222;
    }
    .wave {
      opacity: 0;
    }
    .playing .wave {
      animation: waveFlow 2.8s ease-in-out infinite;
    }

    @keyframes waveFlow {
      0%   { opacity: 0; }
      15%  { opacity: 0.9; }
      60%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @media(max-width: 900px) {
      body {
        padding: 0;
        overflow: auto;
      }

      .appContainer {
        display: block;
      }

      .tabs,
      .tabs .tabs-main {
        display: block;
        height: 40vh;
      }

      .mainContainer {
        margin: 30px 0;
        width: 100%;
      }

      #inputContainer input {
        width: 15%;
      }
    }

    .hide {
      display: none;
    }
  </style>
</head>
<body>
  <div class="head" id="navbar">
    <!-- <select id="wordSelect" placeholder="词典切换" class="control-select"></select>
    <select id="classSelect" placeholder="年级" class="control-select"></select> -->
    <select id="languageSelect" class="control-select" data-type="soundSelect">
      <option value="en-GB" selected>英音</option>
      <option value="en-US">美音</option>
    </select>
    <!-- <select id="levelSelect">
      <option value="easy">简单(多提示)</option>
      <option value="medium" selected>中等</option>
      <option value="hard">困难(少提示)</option>
    </select> -->
    <button class="control-btn toggleLanguage active" data-type="word" data-level="easy">单词拼写</button>
    <button class="control-btn toggleLanguage" data-type="word" data-level="medium">单词跳词拼写</button>
    <button class="control-btn toggleLanguage" data-type="word" data-level="hard">默写</button>
    <button class="control-btn changeIt active" data-type="next" id="nextBtn">下一个单词</button>
  </div>
  
  <div class="appContainer">
    <div class="tabs">
      <div class="tabs-main" id="tabContainer"></div>
    </div>
    <div class="mainContainer">
      <div class="wordContainer">
        <div id="wordDisplay" class="hide"></div>
        <div class="toolContainer">
          <div id="inputContainer" class="hard"></div>
          <button class="sound-btn" id="soundBtn" data-type="sound">
            <svg class="speaker" viewBox="0 0 64 64" id="speaker" data-type="sound">
              <!-- 喇叭主体 -->
              <polygon points="16,24 28,24 40,12 40,52 28,40 16,40" data-type="sound" stroke-linejoin="round"/>
              <!-- 动态波纹 -->
              <g id="waves" data-type="sound" style="transform: translateX(6px);"></g>
            </svg>

          </button>
        </div>
        <div id="soundmark"></div>
        <div id="meaning"></div>
      </div>
      
    </div>
  </div>

  <audio id="soundCorrect" src="./files/correct.wav"></audio>
  <audio id="soundWrong" src="./files/beep.wav"></audio>

  <script src="./js/jQuery.min.js"></script>
  <script src="./js/base.js"></script>

  <script>
    // 分类数据
    let categories = {};
    let words = [];
    let currentIndex = 0;
    let dataType = 'easy';  // easy|medium|hard
    let reviewList = [];
    const wrongCountMap = {};
    let timer = null;
    let currentLang = 'en-GB';
    const inputContainer = document.getElementById('inputContainer');

    function getNextWord(){
      if(reviewList.length) return reviewList.shift();
      currentIndex = (currentIndex + 1) % words.length;
      return words[currentIndex];
    }

    function nextRender() {
      delete wrongCountMap[words[currentIndex].name.toLowerCase()]
      const nextWord = getNextWord();
      words[currentIndex] = nextWord;
      loadWord();
    }
    
    function getTrans(arr) {
      if (!arr || !Array.isArray(arr)) return '';
      return arr.map(item => `<span>${item}</span>`).join('')
    }

    function loadWord(){
      const meaningEl = document.getElementById('meaning');
      const wordDisplay = document.getElementById('wordDisplay');
      const soundMark = document.getElementById('soundmark');
      const data = words[currentIndex];
      const word = data.name.toLowerCase();
      wordDisplay.textContent = word;
      meaningEl.innerHTML = getTrans(data.trans);
      inputContainer.innerHTML = '';
      const typeLang = {
        'en-US': 'usphone',  // 美音
        'en-GB': 'ukphone' // 英音
      }[currentLang] || 'ukphone'

      const languageStart = {
        'ukphone': 'BrE: ',
        'usphone': 'AmE: '
      }
      soundMark.textContent = `${languageStart[typeLang]} ${data[typeLang]}`

      const revealIndexes = [];
      if (dataType === 'medium') {
        const level = 'medium';
        const lettersToShow = level === 'easy' ? Math.floor(word.replace(/\s/g,'').length / 2) : (level === 'medium' ? Math.floor(word.replace(/\s/g,'').length / 3) : 1);
        while (revealIndexes.length < lettersToShow) {
          const i = Math.floor(Math.random() * word.length);
          if (word[i].trim() && !revealIndexes.includes(i)) revealIndexes.push(i);
        }
      }

      for (let i = 0; i < word.length; i++) {
        let elem;
        if (!word[i].trim()) {
          elem = document.createElement('span');
          elem.textContent = word[i];
          elem.classList.add('placeholder');
        } else {
          elem = document.createElement('input');
          elem.maxLength = 1;
          elem.placeholder = word[i];
          dataType === 'hard' && elem.classList.add('hidden-placeholder');
          elem.dataset.index = i;
          if (revealIndexes.includes(i)) {
            elem.value = word[i];
            elem.disabled = true;
            elem.classList.add('correct');
          }
          elem.addEventListener('input', handleInput);
          elem.addEventListener('keydown', handleDelete);
        }
        inputContainer.appendChild(elem);
      }
      inputContainer.querySelector('input:not([disabled])')?.focus();

      speakFemale(word, currentLang, document.getElementById('speaker'), document.getElementById('waves'));
    }

    function handleDelete(e) {
      if (e.key === 'Backspace' && !e.target.value) {
        const elements = [...inputContainer.children];
        let i = Number(e.target.dataset.index) - 1;
        while (i >= 0 && (elements[i].tagName.toLowerCase() !== 'input' || elements[i].disabled)) i--;
        if (i >= 0) {
          const prev = elements[i];
          prev.focus();
          prev.value = '';
          prev.classList.remove('wrong', 'correct');
        }
      }
    }

    function handleInput(e){
      const soundWrong = document.getElementById('soundWrong');
      const soundCorrect = document.getElementById('soundCorrect');
      const input = e.target;
      input.value = input.value.toLowerCase();
      const word = words[currentIndex].name.toLowerCase();

      if(!inputContainer) return;
      const elements = [...inputContainer.children];
      if(!elements.length) return;

      let wordIndex = 0;
      let hasError = false;

      elements.forEach(elem => {
        if (elem.tagName.toLowerCase() !== 'input') {
          wordIndex++;
          return;
        }
        elem.classList.remove('wrong', 'correct');
        if (elem.value) {
            elem.classList.add(elem.value === word[wordIndex] ?'correct' : 'wrong');
            elem.value !== word[wordIndex] && (hasError = true)
        } else {
          hasError = true;
        }
        wordIndex++;
      });

      // 自动跳到下一个 input
      let nextIndex = Number(input.dataset.index) + 1;
      while (nextIndex < elements.length) {
        const nextElem = elements[nextIndex];
        if (nextElem.tagName.toLowerCase() === 'input' && !nextElem.disabled) break;
        nextIndex++;
      }

      (nextIndex < elements.length) && elements[nextIndex].focus();
      
      if (!hasError && elements.every(el => el.tagName.toLowerCase() !== 'input' || el.value !== '')) {
        clearTimeout(timer);
        speakFemale(word, currentLang, document.getElementById('speaker'), document.getElementById('waves'));
        delete wrongCountMap[word]
        reviewList = reviewList.filter(item => item.name.toLowerCase() !== word)
        soundCorrect.play();
        timer = setTimeout(() => {
          nextRender();
        }, 2000);
      } else if (hasError && nextIndex === elements.length) {
        soundWrong.play();
      } else if (hasError) {
        wrongCountMap[word] = (wrongCountMap[word] || 0) + 1;
        if (wrongCountMap[word] >= 2 && !reviewList.includes(words[currentIndex])) reviewList.push(words[currentIndex]);
      }
    }

    function resetBtnDom(className = '.toggleLanguage[data-type]') {
      const btns = document.querySelectorAll(className);
      btns.forEach(btn => btn.classList.remove('active'));
    }

    function tabsRender(key = '一年级上册') {
      const tabContainer = document.getElementById('tabContainer');
      tabContainer.innerHTML = '';
      Object.keys(categories).forEach((cat, index) => {
        const tabBtn = document.createElement('button');
        tabBtn.setAttribute('class', cat === key ? 'active' : '');
        tabBtn.setAttribute('data-type', 'tabBtn');
        tabBtn.setAttribute('data-class', cat);
        tabBtn.setAttribute('data-index', index);
        cat === key && (words = categories[cat]);
        tabBtn.textContent = `${cat}(${categories[cat].length})`;
        tabContainer.appendChild(tabBtn);
      })
    }

    document.addEventListener("click", function(ev) {
      const className = ev.target.classList.toString();
      let type = ev.target.getAttribute('data-type');
      type = type || ev.target.parentNode.getAttribute('data-type')

      switch (type) {
        case 'tabBtn':
          const btnClassName = event.target.getAttribute('data-class');
          const btnIndex = event.target.getAttribute('data-index');
          resetBtnDom('[data-type="tabBtn"]');
          event.target.classList.add('active');
          document.querySelector('[data-type="class"]').selectedIndex = btnIndex || 0;
          words = categories[btnClassName];
          loadWord();
          break;
        case 'sound':
          speakFemale(words[currentIndex].name, currentLang, ev.target, document.getElementById('waves'));
          break;
        case 'next':
          nextRender();
          break;
        case 'word':
          const level = event.target.getAttribute('data-level');
          resetBtnDom();
          dataType = level;
          event.target.classList.add('active');
          loadWord();
          break;
      }
    }, false);

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        clearTimeout(timer);
        nextRender();
      }

      const inputs = document.querySelectorAll(['#inputContainer input']);
      const firstInput = inputs[0];
      firstInput && !firstInput.value && firstInput.focus();
    });

    document.addEventListener('change', function(ev) {
      const dataType = ev.target.getAttribute('data-type');

      switch (dataType) {
        case 'class':
          tabsRender(ev.target.value);
          loadWord();
          break;
        case 'book':
          const url = `./data/school/${ev.target.value || 'waiYanShe'}.json`
          renderClassInfo(url);
          break;
        case 'soundSelect':
          currentLang = ev.target.value || 'en-GB';
          loadWord();
          break;
        default:
          break;
      }
    })

    function createSelect(data, targetId, placeholder, dataType, callBack) {
      if (!Array.isArray(data) || !targetId) return;

      const container = document.getElementById(targetId);
      if (!container) return;

      // reset select
      const allSelectDom = document.querySelectorAll(`.control-select[data-type="${dataType}"]`);
      if (allSelectDom.length) {
        allSelectDom.forEach(function(item) {
          item.remove();
        })
      }

      const select = document.createElement('select');
      select.className = 'control-select';
      select.setAttribute('placeholder', placeholder)
      select.setAttribute('data-type', dataType)
      data.forEach(function(item){
        const option = document.createElement('option');
        option.value = String(item.key);
        option.textContent = String(item.name);
        select.appendChild(option);
      });
      callBack ? callBack(container, select) : container['insertBefore'](select, container.firstChild);
      return select;
    }

    function renderClassInfo(url = './data/school/waiYanShe.json') {
      $.ajax({
        url,
        type: 'GET',
        dataType: 'json',
        async: false
      }).done(function(data) {
        if (!data) return;
        categories = data;
        const firstWord = Object.keys(data)[0]
        words = data[firstWord]
        createSelect(Object.keys(data).map(item => ({
          name: item,
          key: item
        })), 'navbar', '年级切换', 'class', ((container, dom)=> {
          const schoolDom = document.querySelector('.control-select[placeholder="词典切换"]');
          // 在schoolDom 节点的后面增加
          schoolDom.parentNode.insertBefore(dom, schoolDom.nextSibling);
        }));
        loadWord();
        tabsRender(firstWord);
      }).fail(function(error) {
        console.error('Error fetching data', error);
      });
    }

    function getSchoolType() {
      $.ajax({
        url: './data/school/schoolBook.json',
        type: 'GET',
        dataType: 'json',
        async: false
      }).done(function(data) {
        if (!data) return;
        createSelect(data, 'navbar', '词典切换', 'book');
        renderClassInfo(`./data/school/${data[0].key}.json`);
      }).fail(function(error) {
        console.error('Error fetching data', error);
      });
    }

    getSchoolType();
  </script>
</body>
</html>

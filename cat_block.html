            font-size: 1.8rem;

            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            color: #ff9a9e;
        }
        
        .original-text {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            line-height: 1.8;
            border-left: 5px solid #ff9a9e;
            white-space: pre-line;
        }

            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

            background-color: #fff;
            border-radius: 10px;

            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

            border-color: #ff9a9e;
            box-shadow: 0 8px 15px rgba(255, 154, 158, 0.2);

            border-color: #ff6b6b;
            background-color: #fff5f5;
        }

            font-size: 1.1rem;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .sentence-cn {
            font-size: 1rem;
            color: #666;
            padding-left: 10px;
            border-left: 3px solid #ddd;
        }

            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

            display: flex;
            gap: 10px;
            align-items: center;
        }

            padding: 10px 20px;
            background-color: #f1f3f5;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

            color: white;
        }
        
        .filter-btn:hover, .view-btn:hover {
            background-color: #ffd6d6;
        }

            flex-grow: 1;
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #ff9a9e;
        }
        
        .display-area {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            min-height: 300px;
            margin-top: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-size: 4rem;
            margin-bottom: 20px;
        }

            line-height: 1.4;

            font-size: 0.9rem;
            margin-top: 10px;
        }

            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

                </div>
            </section>
        </div>

                    <div class="sentence-en">${sentence.en}</div>
                    <div class="sentence-cn">${sentence.cn}</div>
                    ${sentence.position && positionBadges[sentence.position] ? 
                      `<div class="position-badge">${positionBadges[sentence.position]}</div>` : ''}
                `;
                
                sentenceListElement.appendChild(sentenceItem);
            });
        }
        
        // 更新显示区域
        function updateDisplay() {
            if (filteredSentences.length === 0) {
                displaySentenceElement.textContent = "没有可显示的句子";
                displayTranslationElement.textContent = "No sentences to display";
                sentenceCounterElement.textContent = "0 / 0";
                catEmojiElement.textContent = "😿";
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            
            // 确保当前索引在有效范围内
            if (currentSentenceIndex >= filteredSentences.length) {
                currentSentenceIndex = filteredSentences.length - 1;
            }
            
            if (currentSentenceIndex < 0) {
                currentSentenceIndex = 0;
            }
            
            const currentSentence = filteredSentences[currentSentenceIndex];
            
            // 根据显示模式更新内容
            switch(currentViewMode) {
                case "english":
                    displaySentenceElement.textContent = currentSentence.en;
                    displayTranslationElement.style.display = "none";
                    break;
                case "chinese":
                    displaySentenceElement.textContent = currentSentence.cn;
                    displayTranslationElement.style.display = "none";
                    break;
                case "both":
                default:
                    displaySentenceElement.textContent = currentSentence.en;
                    displayTranslationElement.textContent = currentSentence.cn;
                    displayTranslationElement.style.display = "block";
                    break;
            }
            
            // 更新计数器
            sentenceCounterElement.textContent = `${currentSentenceIndex + 1} / ${filteredSentences.length}`;
            
            // 随机选择猫表情
            const randomEmojiIndex = Math.floor(Math.random() * catEmojis.length);
            catEmojiElement.textContent = catEmojis[randomEmojiIndex];
            
            // 更新按钮状态
            prevBtn.disabled = currentSentenceIndex === 0;
            nextBtn.disabled = currentSentenceIndex === filteredSentences.length - 1;
            
            // 更新句子列表中的活动项
            const allSentenceItems = document.querySelectorAll('.sentence-item');
            allSentenceItems.forEach((item, index) => {
                if (index === currentSentenceIndex) {
                    item.classList.add('active');
                    // 滚动到可见区域
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        // 应用过滤和搜索
        function applyFilters() {
            const data = requestDataList[0];
            
            // 先根据过滤条件筛选
            let filtered = data.option;
            
            if (currentFilter === "short") {
                filtered = filtered.filter(s => s.length === "short");
            } else if (currentFilter === "long") {
                filtered = filtered.filter(s => s.length === "long" || s.length === "medium");
            }
            
            // 再根据搜索关键词筛选
            if (currentSearchTerm.trim() !== "") {
                const searchTerm = currentSearchTerm.toLowerCase();
                filtered = filtered.filter(s => 
                    s.en.toLowerCase().includes(searchTerm) || 
                    s.cn.toLowerCase().includes(searchTerm)
                );
            }
            
            filteredSentences = filtered;
            currentSentenceIndex = 0;
            renderSentenceList();
            updateDisplay();
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 句子点击事件
            sentenceListElement.addEventListener('click', (e) => {
                const sentenceItem = e.target.closest('.sentence-item');
                if (sentenceItem) {
                    const index = parseInt(sentenceItem.dataset.index);
                    currentSentenceIndex = index;
                    updateDisplay();
                }
            });
            
            // 上一句/下一句按钮
            prevBtn.addEventListener('click', () => {
                if (currentSentenceIndex > 0) {
                    currentSentenceIndex--;
                    updateDisplay();
                }
            });
            
            nextBtn.addEventListener('click', () => {
                if (currentSentenceIndex < filteredSentences.length - 1) {
                    currentSentenceIndex++;
                    updateDisplay();
                }
            });
            
            // 过滤按钮
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    applyFilters();
                });
            });
            
            // 视图按钮
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentViewMode = btn.dataset.view;
                    updateDisplay();
                });
            });
            
            // 搜索框
            searchBox.addEventListener('input', (e) => {
                currentSearchTerm = e.target.value;
                applyFilters();
            });
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    // 上一句
                    if (currentSentenceIndex > 0) {
                        currentSentenceIndex--;
                        updateDisplay();
                    }
                } else if (e.key === 'ArrowRight') {
                    // 下一句
                    if (currentSentenceIndex < filteredSentences.length - 1) {
                        currentSentenceIndex++;
                        updateDisplay();
                    }
                }
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
        
        // 示例：如何向数据列表添加新数据
        function addNewData(newData) {
            requestDataList.push(newData);
            // 这里可以添加UI更新逻辑，比如显示新数据集的选项
            console.log('新数据已添加，当前数据列表:', requestDataList);
        }
    </script>
</body>
</html>
